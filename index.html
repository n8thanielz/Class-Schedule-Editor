<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule Visualizer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div id="upload-view" class="upload-view">
      <div class="upload-card">
        <div class="upload-icon">📅</div>
        <h1>Schedule Visualizer</h1>
        <p>Upload a class schedule PDF or CSV to generate a visual schedule</p>
        <label class="upload-btn" for="pdf-input">
          Choose File
          <input type="file" id="pdf-input" accept=".pdf,.csv" />
        </label>
        <div id="upload-error" class="upload-error hidden"></div>
        <div id="upload-loading" class="upload-loading hidden">
          <div class="spinner"></div>
          <span>Parsing schedule…</span>
        </div>
      </div>
    </div>

    <div id="schedule-view" class="schedule-view hidden">
      <div class="toolbar">
        <h1 id="schedule-title"></h1>
        <div class="toolbar-actions">
          <button id="export-btn" class="toolbar-btn">Print</button>
          <button id="export-pdf-btn" class="toolbar-btn">Export PDF</button>
          <button id="new-upload-btn" class="toolbar-btn">↑ Upload New PDF</button>
        </div>
      </div>
      <div class="schedule-body">
        <div id="course-sidebar" class="course-sidebar"></div>
        <div class="schedule-wrapper">
          <div id="schedule-grid" class="schedule-grid"></div>
          <div id="online-panel" class="online-panel"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- pdf.js (3.x UMD build — sets window.pdfjsLib) -->
  <script src="lib/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
  </script>

  <!-- html2pdf (canvas → PDF, no print dialog) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- App modules (order matters) -->
  <script src="js/timeUtils.js"></script>
  <script src="js/colors.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pdfParser.js"></script>
  <script src="js/scheduleGrid.js"></script>
  <script src="js/onlinePanel.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/csvParser.js"></script>
  <script src="js/exportPdf.js"></script>
  <script src="js/exportImage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
